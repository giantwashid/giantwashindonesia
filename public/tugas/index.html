<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffd23f">
<title>Tugas Hari Ini</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800;900&display=swap">
<link rel="stylesheet" href="/absen/absen.css">
<link rel="stylesheet" href="/karyawan/karyawan.css">
<link rel="stylesheet" href="/tugas/tugas.css">
</head>
<body>
<main class="wrap">
  <section id="app-view">
    <div class="top">
      <span class="hello">Tugas Hari Ini</span>
      <a class="pill" href="/karyawan/">← Menu</a>
    </div>
    <span class="label" id="outlet-name"></span>
    <div class="card stack">
      <b id="progress-text">Memuat...</b>
      <div class="bar"><i id="progress-bar" style="width:0"></i></div>
    </div>
    <div class="card" id="list"></div>
    <p id="msg" class="msg"></p>
  </section>
</main>
<input id="photo" type="file" accept="image/*" capture="environment" hidden>
<div id="sheet" class="sheet hidden" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
  <div class="card stack">
    <b id="sheet-title" class="h"></b>
    <img id="preview" alt="Foto tugas">
    <p id="photo-warn" class="warn hidden"></p>
    <label>Catatan (boleh kosong)<textarea id="note" placeholder="mis. ada koin tersangkut, sabun hampir habis"></textarea></label>
    <div class="btnrow">
      <button class="btn pulang" id="retake" type="button">FOTO ULANG</button>
      <button class="btn" id="save" type="button">SIMPAN</button>
    </div>
    <button class="small-btn" id="cancel" type="button">Batal</button>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="/karyawan/common.js"></script>
<script src="/tugas/tugas-lib.js"></script>
<script src="/tugas/tugas.js"></script>
</body>
</html>
