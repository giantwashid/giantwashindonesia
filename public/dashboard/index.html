<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F0ECE4">
<title>Dashboard Outlet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="/dashboard/dashboard.css?v=20261126">
</head>
<body class="dash-page">
<main class="dash">
  <header class="head">
    <div class="title">
      <span class="eyebrow">Dashboard Outlet</span>
      <h1 id="oname">Dashboard</h1>
      <p id="range" class="sub"></p>
      <p id="sync" class="sub"></p>
      <p id="status" class="sub"></p>
    </div>
    <div id="filters" class="filters hidden">
      <label class="sel">Outlet<select id="osel"></select></label>
      <label class="sel">Periode<select id="psel">
        <option value="today">Hari ini</option>
        <option value="7">7 hari terakhir</option>
        <option value="month">Bulan ini</option>
        <option value="last">Bulan lalu</option>
        <option value="90">3 bulan terakhir</option>
      </select></label>
      <a class="back" href="/karyawan/">← Menu</a>
    </div>
  </header>

  <div id="noaccess" class="card hidden">
    <b>Dashboard khusus owner dan manager.</b>
    <p>Kalau Anda manager, minta pemilik mengisi peran dan outlet akun Anda di Panel Laporan, tab Karyawan.</p>
    <p><a href="/karyawan/">← Kembali ke menu</a></p>
  </div>

  <div id="board" class="hidden">
    <section class="card band" id="kpis" aria-label="Ringkasan"></section>

    <section class="row-5">
      <div class="card span-3">
        <div class="cardhead"><h2>Tren penjualan</h2><span class="muted" id="trend-range"></span></div>
        <div id="trend" class="trend"></div>
        <p class="note" id="trend-note"></p>
      </div>
      <div class="card dark span-2">
        <div class="cardhead"><h2 id="cost-title">Biaya bulan ini</h2><span class="muted" id="cost-range"></span></div>
        <div id="costs"></div>
      </div>
    </section>

    <section class="card">
      <div class="cardhead">
        <h2>Laba rugi</h2>
        <label class="sel inline">Periode laporan<select id="isel"></select></label>
      </div>
      <div id="income"></div>
      <p class="note" id="income-note"></p>
    </section>

    <section class="row-3">
      <div class="card"><h2>Produk terlaris</h2><div id="products" class="hbars"></div></div>
      <div class="card"><h2>Cara bayar</h2><div id="pay" class="hbars"></div></div>
      <div class="card"><h2>Jam ramai</h2><div id="hours" class="chart"></div><p class="note">Jumlah nota per jam.</p></div>
    </section>
  </div>
  <div id="tip" class="tip hidden" role="tooltip"></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="/karyawan/common.js?v=20261126"></script>
<script src="/dashboard/dashboard.js?v=20261126"></script>
</body>
</html>
