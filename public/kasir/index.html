<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffd23f">
<title>Kasir Giantwash</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800;900&display=swap">
<link rel="stylesheet" href="/absen/absen.css">
<link rel="stylesheet" href="/kasir/kasir.css">
</head>
<body>
<main class="wrap">

  <!-- LOGIN -->
  <section id="login-view" class="hidden">
    <h1 class="hello">Kasir Giantwash</h1>
    <form id="login-form" class="card stack">
      <label>Email<input name="email" type="email" required autocomplete="username"></label>
      <label>Password<input name="password" type="password" required autocomplete="current-password"></label>
      <button class="btn" type="submit">MASUK</button>
      <p id="login-msg" class="msg"></p>
    </form>
  </section>

  <!-- KASIR -->
  <section id="app-view" class="hidden">
    <div class="top">
      <span class="hello">Penjualan</span>
      <a class="pill" href="/karyawan/">← Menu</a>
    </div>
    <div class="info">
      <b id="outlet-name"></b>
      <span>Kasir: <b id="emp-name">...</b></span>
    </div>
    <div class="card today"><span class="label">HARI INI</span><b id="today">-</b></div>

    <span class="label">KETUK LAYANAN UNTUK MENAMBAH</span>
    <div id="grid" class="tiles"></div>

    <div id="cart-card" class="card cart hidden">
      <span class="h">PESANAN</span>
      <div id="cart"></div>
      <label>Nama pelanggan (boleh kosong)<input id="customer" type="text" autocomplete="off"></label>
      <div>
        <span class="h">BAYAR PAKAI</span>
        <div class="pays" id="pays">
          <button type="button" class="pay on" data-pay="tunai">Tunai</button>
          <button type="button" class="pay" data-pay="qris">QRIS</button>
          <button type="button" class="pay" data-pay="transfer">Transfer</button>
        </div>
      </div>
      <div id="cash-box">
        <label>Uang diterima<input id="cash" type="number" inputmode="numeric" min="0" step="500"></label>
        <p class="change">Kembalian: <b id="change">Rp0</b></p>
      </div>
    </div>

    <div class="card totalbar">
      <div class="sum"><span class="label" id="count">0 ITEM</span><span class="total" id="total">Rp0</span></div>
      <button id="pay-btn" class="btn big-btn" type="button" disabled>BAYAR</button>
    </div>
    <p id="msg" class="msg"></p>
  </section>

  <!-- SELESAI -->
  <section id="done-view" class="hidden">
    <div class="card receipt">
      <div class="rhead"><b id="r-no">NOTA</b><span id="r-time"></span></div>
      <div class="dash"></div>
      <div id="r-items"></div>
      <div class="dash"></div>
      <div class="rrow big"><span>TOTAL</span><b id="r-total"></b></div>
      <div class="rrow"><span>Bayar</span><b id="r-pay"></b></div>
      <div class="rrow" id="r-change-row"><span>Kembalian</span><b id="r-change"></b></div>
    </div>
    <button id="new-btn" class="btn big-btn" type="button">TRANSAKSI BARU</button>
  </section>

  <!-- NOT LINKED -->
  <section id="nolink-view" class="hidden">
    <div class="card stack">
      <h1 class="hello">Akun belum terdaftar</h1>
      <p>Email <b id="nolink-email"></b> belum ada di data karyawan. Minta pemilik toko menambahkan email ini di Panel Laporan, menu Karyawan.</p>
      <button id="logout2" class="btn" type="button">KELUAR</button>
    </div>
  </section>

</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="/kasir/kasir.js"></script>
</body>
</html>
